<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubiq — quiz maker</title>
<style>
@property --pct { syntax: '<number>'; inherits: false; initial-value: 0; }
:root {
  --bg: #0c0b1d; --panel: rgba(30, 27, 66, .6); --line: rgba(150, 140, 255, .2); --text: #eeedff; --muted: #a6a3d0;
  --violet: #7c6cff; --teal: #3ee6c4; --good: #3ee6a0; --bad: #ff6b81; --radius: 16px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font: 1rem/1.55 var(--font); color: var(--text); background: radial-gradient(900px 500px at 15% -10%, #2a2470 0, transparent 60%), radial-gradient(700px 500px at 100% 0, #123f4a 0, transparent 55%), var(--bg); min-height: 100vh; }
main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 60px; }
h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); line-height: 1.15; margin: 0 0 16px; }
h2 { font-size: 1.4rem; margin: 36px 0 14px; } h3 { margin: 0 0 6px; font-size: 1.1rem; }
p { margin: 0 0 12px; } ul, ol { padding-left: 20px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 10px; top: 10px; background: #000; padding: 8px; z-index: 9; }

.bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; max-width: 1040px; margin: 0 auto; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; font-weight: 700; font-size: 1.25rem; cursor: pointer; }
.logo { width: 22px; height: 22px; background: linear-gradient(135deg, var(--violet), var(--teal)); border-radius: 6px; transform: rotate(12deg); box-shadow: 4px 4px 0 #ffffff22; }
.bar nav { display: flex; gap: 6px; }
.bar nav button { background: none; border: 0; padding: 10px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); min-height: 44px; }
.bar nav button:hover, .bar nav button.on { color: var(--text); background: var(--panel); }

.btn { padding: 10px 18px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; transition: transform .15s, background .2s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); background: rgba(124, 108, 255, .25); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(120deg, var(--violet), #5a8bff); border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--bad); border-color: rgba(255, 107, 129, .4); }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

.hero { display: grid; grid-template-columns: 1.4fr 1fr; align-items: center; gap: 20px; padding: 30px 0; }
.hero p { color: var(--muted); max-width: 52ch; }
.emblem { display: grid; place-items: center; } .emblem canvas { width: 260px; max-width: 100%; height: auto; aspect-ratio: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.stats div { padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; }
.stats strong { font-size: 2rem; color: var(--teal); } .stats span, .meta { color: var(--muted); font-size: .9rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.qcard, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; backdrop-filter: blur(10px); }
.qcard { transition: transform .2s, border-color .2s; } .qcard:hover { transform: translateY(-4px) rotateX(2deg); border-color: var(--violet); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-size: .75rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.sample { color: #ffd37a; border-color: #ffd37a66; } .tag.mine { color: var(--teal); border-color: #3ee6c466; }
.recent { list-style: none; padding: 0; } .recent li { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.empty { padding: 24px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }

label { display: block; margin-bottom: 14px; color: var(--muted); font-size: .9rem; }
input:not([type=radio]):not([type=checkbox]), select, textarea { display: block; width: 100%; margin-top: 6px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #100e2a; min-height: 44px; }
.filters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
fieldset { margin: 16px 0; border: 1px solid var(--line); } legend { padding: 0 8px; font-weight: 600; }
.opt { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .opt input[type=radio] { width: 22px; height: 22px; accent-color: var(--teal); flex: none; } .opt input:not([type=radio]) { margin: 0; }
.alert { background: rgba(255, 107, 129, .12); border: 1px solid rgba(255, 107, 129, .5); border-radius: 12px; padding: 12px 16px; margin: 0 auto 16px; max-width: 1000px; } .alert ul { margin: 6px 0 0; }
.ok { color: var(--good); }
.center { text-align: center; } .check { display: inline-flex; align-items: center; gap: 10px; }

.progress { height: 8px; border-radius: 99px; background: #ffffff18; overflow: hidden; margin-bottom: 12px; } .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--teal)); transition: width .4s; }
.choices { border: 0; padding: 0; margin: 0; } .choices legend { padding: 0; margin-bottom: 12px; } .choices h2 { margin: 0; }
.choice { display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: 12px; background: #100e2a; color: var(--text); cursor: pointer; font-size: 1rem; transition: border-color .2s, background .2s; }
.choice input { accent-color: var(--teal); width: 20px; height: 20px; }
.choice:hover, .choice.sel { border-color: var(--violet); } .choice.right { border-color: var(--good); background: rgba(62, 230, 160, .14); } .choice.wrong { border-color: var(--bad); background: rgba(255, 107, 129, .14); }
.feedback { min-height: 48px; margin-top: 10px; } .feedback.right strong { color: var(--good); } .feedback.wrong strong { color: var(--bad); }
.ring { --pct: 0; width: 170px; height: 170px; margin: 10px auto 16px; border-radius: 50%; display: grid; place-items: center; transition: --pct 1.1s ease-out;
  background: conic-gradient(var(--teal) calc(var(--pct) * 1%), #ffffff18 0); box-shadow: 0 10px 30px -10px var(--violet); }
.ring span { width: 128px; height: 128px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 2.2rem; font-weight: 700; }
.review { list-style: none; padding: 0; } .review li { padding: 16px; margin-bottom: 12px; border-radius: 12px; background: var(--panel); border-left: 4px solid var(--bad); } .review li.right { border-color: var(--good); }
.foot { text-align: center; color: var(--muted); font-size: .85rem; padding: 20px; }
@media (max-width: 720px) { .hero, .filters, .two { grid-template-columns: 1fr; } .emblem { order: -1; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.emblem { perspective: 700px; height: 260px; } .cube { width: 110px; height: 110px; position: relative; transform-style: preserve-3d; animation: spin 14s linear infinite; }
.cube i { position: absolute; inset: 0; border: 1px solid #3ee6c4aa; background: rgba(124, 108, 255, .32); }
.cube i:nth-child(1) { transform: translateZ(55px); } .cube i:nth-child(2) { transform: rotateY(180deg) translateZ(55px); } .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(55px); }
.cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(55px); } .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(55px); } .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(55px); }
@keyframes spin { from { transform: rotateX(-20deg) rotateY(0); } to { transform: rotateX(-20deg) rotateY(360deg); } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <button class="brand" data-act="nav" data-to="home" aria-label="Cubiq home"><span class="logo" aria-hidden="true"></span>Cubiq</button>
  <nav id="nav" aria-label="Primary"><button data-act="nav" data-to="home">Dashboard</button><button data-act="nav" data-to="list">Quizzes</button><button data-act="nav" data-to="create">Create</button></nav>
</header>
<p class="alert" id="alert" role="alert" hidden>Your browser blocked local storage, so changes will be lost when you close this tab.</p>
<main id="main"></main>
<footer class="foot">Guest mode. Quizzes and scores are saved only in this browser. There are no accounts and nothing is sent to a server.</footer>
<script>
(() => {
'use strict';
const KEY = 'cubiq:data', VERSION = 1, SECONDS = 20;
const CATS = ['Web', 'Programming', 'Science', 'General', 'History', 'Maths'], DIFFS = ['Easy', 'Medium', 'Hard'];
const q = (id, text, options, answer, explanation = '') => ({ id, text, options, answer, explanation });
const SEED = [
  { id: 'sample-html', sample: true, title: 'HTML Basics', category: 'Web', difficulty: 'Easy', description: 'Check the building blocks of every web page.', questions: [
    q('h1', 'Which tag defines the main heading of a page?', ['<h1>', '<head>', '<header>', '<title>'], 0, '<h1> is the top-level heading. <title> sets the browser tab text.'),
    q('h2', 'Which attribute gives an image a text alternative?', ['title', 'alt', 'src', 'caption'], 1, 'alt is read by screen readers and shown if the image fails to load.'),
    q('h3', 'Which element is best for a block of major navigation links?', ['<nav>', '<aside>', '<section>', '<footer>'], 0, '<nav> marks major navigation blocks.')] },
  { id: 'sample-js', sample: true, title: 'JavaScript Essentials', category: 'Programming', difficulty: 'Medium', description: 'Types, scope and array methods.', questions: [
    q('j1', 'What does typeof null return?', ['"null"', '"object"', '"undefined"', '"number"'], 1, 'A long-standing quirk: typeof null is "object".'),
    q('j2', 'Which array method returns a new array of items that pass a test?', ['map', 'forEach', 'filter', 'reduce'], 2, 'filter keeps items for which the callback returns true.'),
    q('j3', 'Which keyword declares a block-scoped variable that cannot be reassigned?', ['var', 'let', 'const', 'static'], 2)] },
  { id: 'sample-space', sample: true, title: 'Solar System', category: 'Science', difficulty: 'Easy', description: 'A quick tour of our neighbourhood in space.', questions: [
    q('s1', 'Which planet is closest to the Sun?', ['Venus', 'Mercury', 'Mars', 'Earth'], 1),
    q('s2', 'Which planet has the most prominent ring system?', ['Saturn', 'Neptune', 'Mars', 'Mercury'], 0),
    q('s3', 'About how long does sunlight take to reach Earth?', ['8 seconds', '8 minutes', '8 hours', '8 days'], 1, 'Roughly 8 minutes and 20 seconds.')] },
];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const empty = () => ({ version: VERSION, quizzes: [], attempts: [] });
function load() { try { const r = JSON.parse(localStorage.getItem(KEY)); return r && r.version === VERSION && Array.isArray(r.quizzes) && Array.isArray(r.attempts) ? r : empty(); } catch { return empty(); } }
let data = load(), storageBad = false;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); storageBad = false; } catch { storageBad = true; } };
const all = () => [...SEED, ...data.quizzes];
const find = (id) => all().find((x) => x.id === id);
const score = (quiz, a) => { const total = quiz.questions.length, correct = quiz.questions.filter((x) => a[x.id] === x.answer).length; return { correct, total, percent: total ? Math.round((correct / total) * 100) : 0 }; };
const blankQ = () => ({ id: uid(), text: '', options: ['', '', '', ''], answer: 0, explanation: '' });
function validate(d) {
  const e = [];
  if (!d.title.trim()) e.push('Give the quiz a title.');
  if (!d.questions.length) e.push('Add at least one question.');
  d.questions.forEach((x, i) => {
    if (!x.text.trim()) e.push(`Question ${i + 1}: enter the question text.`);
    if (x.options.some((o) => !o.trim())) e.push(`Question ${i + 1}: fill in all four answer choices.`);
    else if (new Set(x.options.map((o) => o.trim().toLowerCase())).size < 4) e.push(`Question ${i + 1}: answer choices must be different.`);
  });
  return e;
}

let route = 'home', draft = null, errors = [], preview = false, play = null, last = null, f = { s: '', c: '', d: '' };
const opts = (list, sel, any) => (any ? `<option value="">All</option>` : '') + list.map((o) => `<option ${o === sel ? 'selected' : ''}>${o}</option>`).join('');
const card = (x, manage) => `<article class="qcard"><div class="tags"><span class="tag">${esc(x.category)}</span><span class="tag">${esc(x.difficulty)}</span><span class="tag ${x.sample ? 'sample' : 'mine'}">${x.sample ? 'Sample' : 'Yours'}</span></div>
  <h3>${esc(x.title)}</h3><p>${esc(x.description || 'No description.')}</p><p class="meta">${x.questions.length} question${x.questions.length === 1 ? '' : 's'}</p>
  <div class="row"><button class="btn primary" data-act="play" data-id="${x.id}">Start quiz</button>${manage && !x.sample ? `<button class="btn" data-act="edit" data-id="${x.id}">Edit</button><button class="btn danger" data-act="del" data-id="${x.id}">Delete</button>` : ''}</div></article>`;

const views = {
  home() {
    const att = data.attempts, avg = att.length ? Math.round(att.reduce((s, a) => s + a.percent, 0) / att.length) : 0;
    const st = [[all().length, '', 'Quizzes available'], [data.quizzes.length, '', 'Created by you'], [att.length, '', 'Attempts finished'], [avg, '%', 'Average score']];
    return `<section class="hero"><div><h1>Make a quiz. Test yourself. See what stuck.</h1><p>Create multiple-choice quizzes in minutes, answer them one question at a time, and get instant feedback and a full review.</p>
      <div class="row"><button class="btn primary" data-act="nav" data-to="create">Create a quiz</button><button class="btn" data-act="nav" data-to="list">Explore quizzes</button></div></div>
      <div class="emblem" aria-hidden="true"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></section>
      <section class="stats" aria-label="Your stats">${st.map(([v, s, l]) => `<div><strong data-count="${v}" data-suffix="${s}">${v}${s}</strong><span>${l}</span></div>`).join('')}</section>
      <h2>Featured quizzes</h2><div class="grid">${all().slice(0, 3).map((x) => card(x)).join('')}</div>
      <h2>Recent attempts</h2>${att.length ? `<ul class="recent">${att.slice(0, 5).map((a) => `<li><span>${esc(a.quizTitle)}</span><span>${a.correct}/${a.total} (${a.percent}%)</span><time>${new Date(a.date).toLocaleDateString()}</time></li>`).join('')}</ul>` : '<p class="empty">No attempts yet. Start any quiz and your scores will appear here.</p>'}`;
  },
  list() {
    return `<h1>Quizzes</h1><div class="filters" role="search"><label>Search by title<input id="fs" type="search" value="${esc(f.s)}" placeholder="e.g. JavaScript"></label>
      <label>Category<select id="fc">${opts(CATS, f.c, true)}</select></label><label>Difficulty<select id="fd">${opts(DIFFS, f.d, true)}</select></label></div><div id="grid"></div>`;
  },
  create() {
    const d = draft;
    return `<form id="form" novalidate><h1>${data.quizzes.some((x) => x.id === d.id) ? 'Edit quiz' : 'Create a quiz'}</h1>
      ${errors.length ? `<div class="alert" role="alert" tabindex="-1" id="errs"><strong>Fix these before saving:</strong><ul>${errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}
      <div class="panel"><label>Title<input data-f="title" value="${esc(d.title)}" maxlength="80"></label><label>Description<textarea data-f="description" rows="2" maxlength="200">${esc(d.description)}</textarea></label>
      <div class="two"><label>Category<select data-f="category">${opts(CATS, d.category)}</select></label><label>Difficulty<select data-f="difficulty">${opts(DIFFS, d.difficulty)}</select></label></div></div>
      ${d.questions.map((x, i) => `<fieldset class="panel"><legend>Question ${i + 1}</legend><label>Question text<input data-q="${i}" data-k="text" value="${esc(x.text)}"></label>
        ${x.options.map((o, j) => `<div class="opt"><input type="radio" name="ans${i}" data-q="${i}" data-ans="${j}" ${x.answer === j ? 'checked' : ''} aria-label="Mark choice ${j + 1} as correct"><input data-q="${i}" data-o="${j}" value="${esc(o)}" placeholder="Choice ${j + 1}" aria-label="Question ${i + 1} choice ${j + 1}"></div>`).join('')}
        <label>Explanation (optional)<input data-q="${i}" data-k="explanation" value="${esc(x.explanation)}"></label>
        <div class="row"><button type="button" class="btn" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>Move up</button><button type="button" class="btn" data-act="down" data-i="${i}" ${i === d.questions.length - 1 ? 'disabled' : ''}>Move down</button><button type="button" class="btn danger" data-act="delq" data-i="${i}">Delete question</button></div></fieldset>`).join('')}
      <div class="row"><button type="button" class="btn" data-act="addq">Add question</button><button type="button" class="btn" data-act="preview" aria-expanded="${preview}">${preview ? 'Hide preview' : 'Preview'}</button><button type="submit" class="btn primary">Publish quiz</button></div>
      ${preview ? `<section class="panel" aria-label="Preview"><h2>${esc(d.title || 'Untitled quiz')}</h2><p>${esc(d.description)}</p>${d.questions.map((x, i) => `<h3>${i + 1}. ${esc(x.text || '(empty question)')}</h3><ul>${x.options.map((o, j) => `<li class="${j === x.answer ? 'ok' : ''}">${esc(o || '(empty)')}${j === x.answer ? ' (correct)' : ''}</li>`).join('')}</ul>`).join('')}</section>` : ''}</form>`;
  },
  take() {
    const p = play, quiz = p.quiz;
    if (!quiz.questions.length) return '<p class="empty">This quiz has no questions yet.</p>';
    if (!p.started) return `<div class="panel center"><h1>${esc(quiz.title)}</h1><p>${quiz.questions.length} questions. Pick an answer, then confirm it to see the result.</p><label class="check"><input type="checkbox" id="timed"> Timer mode (${SECONDS} seconds per question)</label>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="begin">Begin</button><button class="btn" data-act="nav" data-to="list">Back</button></div></div>`;
    const x = quiz.questions[p.i], last = p.i === quiz.questions.length - 1, done = p.i + (p.locked ? 1 : 0), ok = p.locked && p.answers[x.id] === x.answer;
    return `<div class="panel"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${quiz.questions.length}" aria-valuenow="${done}" aria-label="Quiz progress"><i style="width:${(done / quiz.questions.length) * 100}%"></i></div>
      <p class="meta">Question ${p.i + 1} of ${quiz.questions.length}<span id="left">${p.timed && !p.locked ? ` · ${p.left}s left` : ''}</span></p>
      <fieldset class="choices" ${p.locked ? 'disabled' : ''}><legend><h2>${esc(x.text)}</h2></legend>${x.options.map((o, j) => `<label class="choice ${p.locked ? (j === x.answer ? 'right' : j === p.answers[x.id] ? 'wrong' : '') : ''} ${p.picked === j ? 'sel' : ''}"><input type="radio" name="choice" value="${j}" ${p.picked === j ? 'checked' : ''}>${esc(o)}</label>`).join('')}</fieldset>
      <div class="feedback ${p.locked ? (ok ? 'right' : 'wrong') : ''}" role="status" tabindex="-1" id="fb">${p.locked ? `<strong>${p.answers[x.id] == null ? 'Time is up.' : ok ? 'Correct!' : 'Not quite.'}</strong>${ok ? '' : ` The answer is “${esc(x.options[x.answer])}”.`}${x.explanation ? `<p>${esc(x.explanation)}</p>` : ''}` : ''}</div>
      <div class="row">${p.locked ? `<button class="btn primary" data-act="next">${last ? 'See results' : 'Next question'}</button>` : `<button class="btn primary" id="confirmBtn" data-act="confirm" ${p.picked === null ? 'disabled' : ''}>Confirm answer</button>`}<button class="btn" data-act="quit">Quit</button></div></div>`;
  },
  results() {
    if (!last) return '<p class="empty">No results to show.</p>';
    const { quiz, answers } = last, s = score(quiz, answers);
    return `<h1>Results: ${esc(quiz.title)}</h1><div class="panel center"><div class="ring" id="ring" style="--pct:0" role="img" aria-label="${s.percent} percent"><span>${s.percent}%</span></div>
      <p><strong>${s.correct}</strong> correct out of <strong>${s.total}</strong></p><div class="row" style="justify-content:center"><button class="btn primary" data-act="play" data-id="${quiz.id}">Retry quiz</button><button class="btn" data-act="nav" data-to="home">Return to dashboard</button></div></div>
      <h2>Review</h2><ol class="review">${quiz.questions.map((x) => { const a = answers[x.id], ok = a === x.answer; return `<li class="${ok ? 'right' : 'wrong'}"><h3>${esc(x.text)}</h3><p>Your answer: ${a == null ? 'No answer' : esc(x.options[a])} <strong>${ok ? '(correct)' : '(incorrect)'}</strong></p>${ok ? '' : `<p>Correct answer: ${esc(x.options[x.answer])}</p>`}${x.explanation ? `<p class="meta">${esc(x.explanation)}</p>` : ''}</li>`; }).join('')}</ol>`;
  },
};

function renderGrid() {
  const shown = all().filter((x) => x.title.toLowerCase().includes(f.s.trim().toLowerCase()) && (!f.c || x.category === f.c) && (!f.d || x.difficulty === f.d));
  $('#grid').innerHTML = `<p class="meta" role="status">${shown.length} quiz${shown.length === 1 ? '' : 'zes'} found</p>` + (shown.length
    ? `<div class="grid">${shown.map((x) => card(x, true)).join('')}</div>`
    : '<div class="empty"><p>No quizzes match those filters.</p><button class="btn" data-act="clearf">Clear filters</button> <button class="btn primary" data-act="nav" data-to="create">Create a quiz</button></div>');
}
function render() {
  $('#alert').hidden = !storageBad;
  document.querySelectorAll('#nav button').forEach((b) => { const on = b.dataset.to === route || (route === 'create' && b.dataset.to === 'create'); b.classList.toggle('on', on); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); });
  $('#main').innerHTML = views[route]();
  if (route === 'list') renderGrid();
  if (route === 'create' && errors.length) $('#errs').focus();
  if (route === 'take' && play.locked) $('#fb').focus();
  if (route === 'home') document.querySelectorAll('[data-count]').forEach((el) => {
    const end = +el.dataset.count, sfx = el.dataset.suffix;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !end) return;
    const t0 = performance.now(); (function tick(n) { const t = Math.min((n - t0) / 900, 1); el.textContent = Math.round(end * (1 - (1 - t) ** 3)) + sfx; if (t < 1) requestAnimationFrame(tick); })(t0);
  });
  if (route === 'results') setTimeout(() => $('#ring') && $('#ring').style.setProperty('--pct', score(last.quiz, last.answers).percent), 60);
}
function go(name) { route = name; if (name !== 'create') { errors = []; preview = false; } window.scrollTo(0, 0); render(); }
function startPlay(id) { play = { quiz: find(id), i: 0, picked: null, locked: false, answers: {}, timed: false, left: SECONDS, started: false, saved: false }; go('take'); }
function lock(choice) {
  if (play.locked) return; const x = play.quiz.questions[play.i];
  play.locked = true; play.answers[x.id] = choice; render();
}
setInterval(() => {
  if (route !== 'take' || !play || !play.started || !play.timed || play.locked) return;
  play.left -= 1; const el = $('#left'); if (el) el.textContent = ` · ${Math.max(play.left, 0)}s left`;
  if (play.left <= 0) lock(play.picked);
}, 1000);

const actions = {
  nav: (d) => { if (d.to === 'create' && route !== 'create') { draft = { id: uid(), title: '', description: '', category: CATS[0], difficulty: 'Easy', sample: false, questions: [blankQ()] }; } go(d.to); },
  play: (d) => startPlay(d.id),
  begin: () => { play.timed = !!$('#timed').checked; play.started = true; play.left = SECONDS; render(); },
  confirm: () => { if (play.picked !== null) lock(play.picked); },
  next() {
    const quiz = play.quiz;
    if (play.i < quiz.questions.length - 1) { play.i++; play.picked = null; play.locked = false; play.left = SECONDS; render(); return; }
    if (play.saved) return; play.saved = true;
    const s = score(quiz, play.answers);
    data.attempts = [{ id: uid(), quizId: quiz.id, quizTitle: quiz.title, ...s, date: new Date().toISOString() }, ...data.attempts].slice(0, 50); save();
    last = { quiz, answers: play.answers }; go('results');
  },
  quit: () => { if (confirm('Leave this quiz? Your progress will be lost.')) go('list'); },
  edit: (d) => { draft = JSON.parse(JSON.stringify(find(d.id))); go('create'); },
  del(d) { const x = find(d.id); if (x && confirm(`Delete "${x.title}"? This cannot be undone.`)) { data.quizzes = data.quizzes.filter((y) => y.id !== d.id); save(); render(); } },
  addq: () => { draft.questions.push(blankQ()); render(); },
  delq: (d) => { draft.questions.splice(+d.i, 1); render(); },
  up: (d) => { const i = +d.i, a = draft.questions; if (i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; render(); } },
  down: (d) => { const i = +d.i, a = draft.questions; if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; render(); } },
  preview: () => { preview = !preview; render(); },
  clearf: () => { f = { s: '', c: '', d: '' }; render(); },
};
document.addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b && actions[b.dataset.act]) actions[b.dataset.act](b.dataset); });
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'fs') { f.s = t.value; renderGrid(); return; }
  if (route !== 'create') return;
  if (t.dataset.f) draft[t.dataset.f] = t.value;
  else if (t.dataset.k) draft.questions[+t.dataset.q][t.dataset.k] = t.value;
  else if (t.dataset.o !== undefined) draft.questions[+t.dataset.q].options[+t.dataset.o] = t.value;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'fc') { f.c = t.value; renderGrid(); }
  else if (t.id === 'fd') { f.d = t.value; renderGrid(); }
  else if (t.dataset.ans !== undefined) draft.questions[+t.dataset.q].answer = +t.dataset.ans;
  else if (t.name === 'choice') { play.picked = +t.value; document.querySelectorAll('.choice').forEach((l) => l.classList.toggle('sel', l.contains(t))); $('#confirmBtn').disabled = false; }
  else if (t.dataset.f) draft[t.dataset.f] = t.value;
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); errors = validate(draft);
  if (errors.length) { render(); return; }
  const quiz = { ...draft, title: draft.title.trim(), description: draft.description.trim(), sample: false };
  data.quizzes = data.quizzes.some((x) => x.id === quiz.id) ? data.quizzes.map((x) => (x.id === quiz.id ? quiz : x)) : [quiz, ...data.quizzes];
  save(); draft = null; go('list');
});
render();
})();

</script>
</body>
</html>
